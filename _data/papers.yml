- year: 2023
  title: "In-Context Exemplars as Clues to Retrieving from Large Associative Memory"
  authors: "Jiachen Zhao"
  venue: ICML 2023 Workshop
  venue_detail: "Neural Conversational AI @ ICML 2023 · Associative Memory & Hopfield Networks @ NeurIPS 2023"
  links:
    - label: PDF
      url: https://arxiv.org/pdf/2311.03498.pdf
  # tldr: "We reinterpret In-Context Learning (ICL) of LLMs as contextual retrieval from associative memory motivated by the fact that no gradients update occurs in ICL and analyze error bounds of retrieval errors. We relate ICL to humans' memory systems to show some phenomenon-level biological plausibility. We also discuss the implication of our theory to exemplar selection."

- year: 2022
  title: "Trigger-free Event Detection via Derangement Reading Comprehension"
  authors: "Jiachen Zhao, Haiqin Yang"
  venue: arXiv
  links:
    - label: PDF
      url: https://arxiv.org/pdf/2208.09659.pdf
  # tldr: "This work tries to improve the performance of event detection when human-labeled triggers are not available (the word in a sentence that is the most representative of the sentence and, thus very costly to annotate). We reformulate this event classification problem into a multiple-choice QA task to better leverage self-attention. We also propose a token derangement module to tackle the imbalanced learning issue. Our trigger-free method can reach SOTA performance and even outperform approaches relying on triggers."
