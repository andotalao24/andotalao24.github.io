- year: 2024
  title: "Multistage Collaborative Knowledge Distillation from a Large Language Model for Semi-Supervised Sequence Generation"
  authors: "Jiachen Zhao, Wenlong Zhao*, Andrew Drozdov*, Benjamin Rozonoyer, Md Arafat Sultan, Jay-Yoon Lee, Mohit Iyyer, Andrew McCallum"
  venue: ACL 2024
  links:
    - label: PDF
      url: https://arxiv.org/pdf/2311.08640.pdf
  # tldr: "We study a challenging scenario where labeled data are too few to finetune a model and few-shot prompted LLMs also have suboptimal performance. We find that a student model that has memorized sufficient teacher labels during knowledge distillation can outperform the teacher model on held-out data by correcting teacher's mistakes instead of repeating them. We then propose Multistage Collaborative Knowledge Distillation (MCKD). On challenging biomedical parsing, 3-stage MCKD with 50 labeled examples matches the performance of supervised finetuning with 500 examples and outperforms the prompted LLM and vanilla KD by 7.5% and 3.7% parsing F1, respectively."

- year: 2024
  title: "Adaptive Fusion of Deep Learning with Statistical Anatomical Knowledge for Robust Patella Segmentation from CT Images"
  authors: "Jiachen Zhao, Tianshu Jiang, Yi Lin, Justin Chan, Ping-Keung Lewis Chan, Chunyi Wen, Hao Chen"
  venue: IEEE JBHI
  venue_detail: "IEEE Journal of Biomedical and Health Informatics"
  links:
    - label: Paper
      url: https://ieeexplore.ieee.org/abstract/document/10461000
  # tldr: "Neural networks (NNs) for medical image segmentation are vulnerable to corrupted images and require sufficient labeled training data. To handle such issues, we propose to combine neural networks with statistical shape models (SSMs) and our method can automatically determine the contribution of NNs and SSMs during combination by leveraging proposed statistical methods. Our approach can be attached to mainstream deep learning methods to improve the robustness and data efficiency."

- year: 2023
  title: "SELF-EXPLAIN: Teaching Large Language Models to Reason Complex Questions by Themselves"
  authors: "Jiachen Zhao, Zonghai Yao, Zhichao Yang, Hong Yu"
  venue: NeurIPS 2023 Workshop
  venue_detail: "Workshop on Robustness of Zero/Few-shot Learning in Foundation Models"
  links:
    - label: PDF
      url: https://arxiv.org/pdf/2311.06985v1
  # tldr: "It remains unclear the principles to craft Chain-of-Thought examples for few-shot prompting. The style and expression of in-context exemplars can influence the prompting performance. Inspired by encoding specificity in humans' memory systems, we propose SELF-EXPLAIN to elicit LLMs' explanations of complex questions by themselves. Prompting with self-explanations through in-context learning can make LLMs more confident and more calibrated as well. Prompting with self-explanation can even outperform prompting with human-crafted CoT on reasoning tasks in both medical and general domains."

